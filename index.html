<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giới thiệu | Lê Hoàng Trà My</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25334a;
      --muted: #65738b;
      --accent: #527a70;
      --paper: #ffffff;
      --wash: #f1f5f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #eaf1ed, #f7f4ed);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(100%, 720px);
      overflow: hidden;
      background: var(--paper);
      border: 1px solid #e4eae6;
      border-radius: 24px;
      box-shadow: 0 18px 55px rgba(38, 59, 51, .10);
    }
    header {
      padding: 42px 44px 36px;
      background: var(--wash);
      border-bottom: 1px solid #e4eae6;
    }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; }
    .intro { margin: 12px 0 0; color: var(--muted); }
    .details { padding: 12px 44px 34px; }
    section { padding: 22px 0; border-bottom: 1px solid #edf0ee; }
    section:last-child { border-bottom: 0; }
    h2 { margin: 0 0 8px; font-size: 1rem; color: var(--accent); }
    p { margin: 0; }
    .skills { display: flex; flex-wrap: wrap; gap: 9px; }
    .skills span {
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--wash);
      color: #405d54;
      font-size: .93rem;
    }
    @media (max-width: 520px) {
      body { padding: 20px 14px; }
      header { padding: 32px 25px 28px; }
      .details { padding: 6px 25px 22px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Giới thiệu cá nhân</p>
      <h1>Lê Hoàng Trà My</h1>
      <p class="intro">Một chút thông tin về tôi</p>
    </header>
    <div class="details">
      <section>
        <h2>Chuyên ngành</h2>
        <p>Quan Hệ Công Chúng</p>
      </section>
      <section>
        <h2>Kỹ năng</h2>
        <div class="skills">
          <span>Chụp hình</span>
          <span>Làm việc nhóm</span>
          <span>Chơi thể thao</span>
        </div>
      </section>
      <section>
        <h2>Mục tiêu nghề nghiệp</h2>
        <p>Trở thành CEO năm 30 tuổi</p>
      </section>
    </div>
      <a href="home.html" style="display:block; width:fit-content; margin:24px auto 0; padding:12px 20px; border-radius:12px; background:#5268bd; color:#fff; font:600 1rem 'Segoe UI',Arial,sans-serif; text-decoration:none; text-align:center;">Trở về trang chính</a></main>
</body>
</html>
