<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trang chủ | Lê Hoàng Trà My</title>
  <style>
    :root {
      font-family: "Segoe UI", Arial, sans-serif;
      color: #242b42;
      background: #f5f7fb;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 15%, rgba(155, 180, 255, .25), transparent 32%),
        radial-gradient(circle at 88% 82%, rgba(255, 203, 151, .28), transparent 30%),
        #f5f7fb;
    }
    main {
      width: min(100%, 820px);
      padding: clamp(32px, 7vw, 72px);
      border: 1px solid #e8ebf2;
      border-radius: 30px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 24px 70px rgba(41, 53, 91, .11);
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 18px;
      color: #6375bc;
      font-size: .82rem;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 680px;
      margin: 0 auto;
      color: #28365f;
      font-size: clamp(2rem, 6vw, 3.65rem);
      line-height: 1.12;
      letter-spacing: -.04em;
    }
    .intro {
      margin: 20px 0 36px;
      color: #687187;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.65;
    }
    nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .nav-link {
      min-height: 76px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #dfe5f5;
      border-radius: 17px;
      background: #f8f9ff;
      color: #35477f;
      font-size: 1.04rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .nav-link:hover {
      transform: translateY(-3px);
      background: #eef1ff;
      box-shadow: 0 10px 22px rgba(69, 85, 152, .13);
    }
    .nav-link:focus-visible { outline: 3px solid #93a5ef; outline-offset: 4px; }
    @media (max-width: 620px) {
      body { padding: 16px; }
      main { border-radius: 24px; }
      nav { grid-template-columns: 1fr; gap: 11px; }
      .nav-link { min-height: 64px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Trang cá nhân</p>
    <h1>Chào mừng đến với trang web của Lê Hoàng Trà My</h1>
    <p class="intro">Hãy làm hết mình với những thứ mà mình đã chọn.</p>
    <nav aria-label="Đi đến các trang">
      <a class="nav-link" href="index.html">Giới thiệu về tôi</a>
      <a class="nav-link" href="event.html">Sự kiện</a>
      <a class="nav-link" href="product.html">Sản phẩm</a>
    </nav>
  </main>
</body>
</html>
