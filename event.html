<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chương trình âm nhac "Ba Ơi!"</title>
  <style>
    :root {
      font-family: "Segoe UI", Arial, sans-serif;
      color: #18223b;
      background: #f5f3ff;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 12% 8%, rgba(255, 197, 90, .35), transparent 35%),
        radial-gradient(ellipse at 90% 88%, rgba(125, 102, 255, .22), transparent 38%),
        #f5f3ff;
    }
    main {
      width: min(100%, 850px);
      overflow: hidden;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(44, 37, 92, .14);
    }
    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(34px, 7vw, 68px);
      color: white;
      background: linear-gradient(130deg, #6638d7, #9a54e9 62%, #ec6b9c);
    }
    .hero::after {
      content: "♫";
      position: absolute;
      right: 7%;
      bottom: -72px;
      color: rgba(255,255,255,.13);
      font-size: 270px;
      line-height: 1;
      transform: rotate(-12deg);
      pointer-events: none;
    }
    .tag {
      display: inline-block;
      margin: 0 0 18px;
      padding: 7px 13px;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 999px;
      color: #fff;
      font-size: .86rem;
      font-weight: 650;
      letter-spacing: .02em;
    }
    h1 {
      position: relative;
      z-index: 1;
      max-width: 620px;
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 4.4rem);
      line-height: 1.05;
      letter-spacing: -.04em;
    }
    .audience {
      position: relative;
      z-index: 1;
      margin: 18px 0 0;
      color: rgba(255,255,255,.9);
      font-size: 1.05rem;
    }
    .content { padding: clamp(24px, 5vw, 44px); }
    .highlights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: -72px;
      position: relative;
      z-index: 2;
    }
    .highlight {
      min-height: 128px;
      padding: 20px;
      border: 1px solid #eee9ff;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 26px rgba(57, 42, 110, .1);
    }
    .highlight.deadline { background: #fff5d9; border-color: #ffe5a1; }
    .label {
      display: block;
      margin-bottom: 9px;
      color: #766d91;
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .value { color: #352069; font-size: clamp(1.05rem, 2.4vw, 1.35rem); font-weight: 750; }
    .deadline .value { color: #8a4b00; }
    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 28px;
      margin-top: 30px;
    }
    .detail { padding: 18px 0; border-bottom: 1px solid #eeeaf5; }
    .detail h2 { margin: 0 0 6px; color: #766d91; font-size: .83rem; font-weight: 700; }
    .detail p { margin: 0; font-size: 1.05rem; font-weight: 650; }
    @media (max-width: 620px) {
      body { padding: 16px 12px; }
      main { border-radius: 20px; }
      .highlights { grid-template-columns: 1fr; gap: 10px; margin-top: -38px; }
      .highlight { min-height: auto; padding: 16px 18px; }
      .label { margin-bottom: 4px; }
      .details { grid-template-columns: 1fr; margin-top: 18px; }
      .hero::after { right: -25px; font-size: 210px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <p class="tag">Dành cho sinh viên đại học</p>
      <h1>Chương trình âm nhac "Ba Ơi!"</h1>
      <p class="audience">Một chương trình dành cho sinh viên đại học</p>
    </header>
    <div class="content">
      <section class="highlights" aria-label="Thông tin nổi bật">
        <div class="highlight">
          <span class="label">Ngày</span>
          <div class="value">04 tháng 12 năm 2026</div>
        </div>
        <div class="highlight">
          <span class="label">Thời gian</span>
          <div class="value">18:30 - 19h30</div>
        </div>
        <div class="highlight deadline">
          <span class="label">Hạn đăng ký</span>
          <div class="value">23 tháng 11</div>
        </div>
      </section>
      <section class="details" aria-label="Thông tin sự kiện">
        <div class="detail">
          <h2>Địa điểm</h2>
          <p>Hội trường 5B trường Đại học Gia Định</p>
        </div>
        <div class="detail">
          <h2>Chi phí</h2>
          <p>Miễn phí</p>
        </div>
      </section>
    </div>
      <a href="home.html" style="display:block; width:fit-content; margin:24px auto 0; padding:12px 20px; border-radius:12px; background:#5268bd; color:#fff; font:600 1rem 'Segoe UI',Arial,sans-serif; text-decoration:none; text-align:center;">Trở về trang chính</a></main>
</body>
</html>
