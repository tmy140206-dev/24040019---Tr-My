<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyMate Notebook</title>
  <style>
    :root {
      font-family: "Segoe UI", Arial, sans-serif;
      color: #20283a;
      background: #f4f6fb;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 12% 12%, #e6eeff 0, transparent 34%), #f4f6fb;
    }
    main {
      width: min(100%, 900px);
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      overflow: hidden;
      border: 1px solid #e7eaf2;
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(37, 53, 91, .1);
    }
    .copy { padding: clamp(30px, 6vw, 62px); }
    .audience {
      display: inline-block;
      margin: 0 0 18px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #edf2ff;
      color: #4259a8;
      font-size: .86rem;
      font-weight: 650;
    }
    h1 {
      margin: 0;
      color: #24345f;
      font-size: clamp(2.2rem, 6vw, 3.7rem);
      line-height: 1.08;
      letter-spacing: -.04em;
    }
    .description { margin: 18px 0 30px; color: #606b80; font-size: 1.08rem; line-height: 1.7; }
    h2 { margin: 0 0 14px; color: #29375c; font-size: 1.15rem; }
    ul { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    li { display: flex; align-items: flex-start; gap: 11px; color: #465168; line-height: 1.5; }
    li::before {
      content: "✓";
      flex: 0 0 23px;
      width: 23px;
      height: 23px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e9f5ee;
      color: #347451;
      font-size: .8rem;
      font-weight: 800;
    }
    .side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 38px;
      background: linear-gradient(155deg, #e8edff, #f1eaff);
      text-align: center;
    }
    .notebook {
      width: 150px;
      height: 190px;
      margin-bottom: 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(44, 60, 111, .12);
      border-left: 9px solid #5467b3;
      border-radius: 12px 17px 17px 12px;
      background: linear-gradient(135deg, #fff, #f7f8ff);
      box-shadow: 10px 14px 24px rgba(50, 61, 117, .16);
      color: #5467b3;
      font-size: 3rem;
    }
    .price-card {
      width: min(100%, 290px);
      padding: 22px;
      border: 1px solid #e2e5f3;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(50, 61, 117, .08);
    }
    .price-label { margin: 0 0 4px; color: #707a90; font-size: .9rem; }
    .price { margin: 0 0 18px; color: #293a75; font-size: 2rem; font-weight: 800; }
    button {
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      background: #5268bd;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #9aabf0; outline-offset: 3px; }
    @media (max-width: 680px) {
      body { padding: 14px; }
      main { grid-template-columns: 1fr; }
      .copy { padding: 32px 26px; }
      .side { padding: 30px 24px; }
      .notebook { width: 120px; height: 150px; font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <p class="audience">Dành cho sinh viên đại học</p>
      <h1>StudyMate Notebook</h1>
      <p class="description">Một cuốn sổ hỗ trợ ghi chú bài học và lập kế hoạch hàng tuần.</p>
      <h2>Lợi ích sản phẩm</h2>
      <ul>
        <li>Ghi chú bài học</li>
        <li>Lập kế hoạch hàng tuần</li>
      </ul>
    </section>
    <aside class="side">
      <div class="notebook" aria-hidden="true">✎</div>
      <div class="price-card">
        <p class="price-label">Giá sản phẩm</p>
        <p class="price">80.000 VND</p>
        <button type="button">Tìm hiểu thêm</button>
      </div>
    </aside>
      <a href="home.html" style="display:block; width:fit-content; margin:24px auto 0; padding:12px 20px; border-radius:12px; background:#5268bd; color:#fff; font:600 1rem 'Segoe UI',Arial,sans-serif; text-decoration:none; text-align:center;">Trở về trang chính</a></main>
</body>
</html>
